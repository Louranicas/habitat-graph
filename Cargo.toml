# habitat-graph — Cargo workspace (standalone repo; own remotes only)
# Bottom-up per ULTRAMAP.md: P0 = core (this commit). Crates added as layers land.
[workspace]
resolver = "2"
members = ["crates/habitat-graph-core"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Louranicas/habitat-graph"
authors = ["Louranicas"]
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = "thin"
