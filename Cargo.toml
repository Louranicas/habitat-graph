# habitat-graph — Cargo workspace (standalone repo; own remotes only)
# Bottom-up per ULTRAMAP.md: P0 = core (this commit). Crates added as layers land.
[workspace]
resolver = "2"
members = [
    "crates/habitat-graph-core",
    "crates/habitat-graph-cache",
    "crates/habitat-graph-source",
    "crates/habitat-graph-extract",
    "crates/habitat-graph-backend",
    "crates/habitat-graph-build",
    "crates/habitat-graph-analyze",
    "crates/habitat-graph-export",
    "crates/habitat-graph-cli",
    "crates/habitat-graph-serve",
    "crates/habitat-graph-fixtures",
    "crates/habitat-graph-daemon",
    "crates/habitat-graph-habitat",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Louranicas/habitat-graph"
authors = ["Louranicas"]
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
blake3 = "1"
ignore = "0.4"
rayon = "1"
indexmap = "2"
leiden-rs = "0.8"
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
# PA-1 grammar fan-out (S1008901, ABI matrix §6 — single core 0.25.x; all bind tree-sitter-language ^0.1)
tree-sitter-typescript = "0.23.2" # provides TS + TSX (two LanguageFn exports)
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
arc-swap = "1"
habitat-graph-core = { path = "crates/habitat-graph-core" }
habitat-graph-source = { path = "crates/habitat-graph-source" }
habitat-graph-extract = { path = "crates/habitat-graph-extract" }
habitat-graph-backend = { path = "crates/habitat-graph-backend" }
habitat-graph-build = { path = "crates/habitat-graph-build" }
habitat-graph-analyze = { path = "crates/habitat-graph-analyze" }
habitat-graph-export = { path = "crates/habitat-graph-export" }
habitat-graph-serve = { path = "crates/habitat-graph-serve" }
habitat-graph-daemon = { path = "crates/habitat-graph-daemon" }
habitat-graph-habitat = { path = "crates/habitat-graph-habitat" }

[profile.release]
lto = "thin"
