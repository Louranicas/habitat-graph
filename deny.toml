# deny.toml — cargo-deny policy for habitat-graph
# Minimal permissive-but-sane baseline; tighten per-section as the workspace matures.
# Reference: https://embarkstudios.github.io/cargo-deny/
#
# Sections:
#   [advisories] — RUSTSEC vulnerability/advisory handling
#   [licenses]   — SPDX licence allow-list
#   [bans]       — duplicate-version and wildcard-dep policy
#   [sources]    — allowed crate registries

[advisories]
version = 2
# v2 schema: vulnerability key removed (CVEs always denied); unmaintained is a
# scope selector; yanked is a lint level. Add RUSTSEC-YYYY-NNNN to ignore[]
# only when the advisory is confirmed irrelevant to this workspace.
unmaintained  = "all"
yanked        = "deny"
ignore = []

[licenses]
version = 2
# Allow-list covers the full open-source spectrum used by this dep tree.
# Workspace itself is MIT OR Apache-2.0; tree-sitter family is MIT;
# various ecosystem crates add BSD-*, ISC, Zlib, Unicode-DFS-2016.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
# Minimum confidence that a detected licence matches the declared SPDX expression.
confidence-threshold = 0.8
exceptions = []

[bans]
# Warn (not deny) on duplicate major versions during the migration phase.
# Promote to "deny" once the dep tree is stable.
multiple-versions = "warn"
# Workspace path-deps carry version="*" which is standard; warn rather than
# deny so internal crate references don't block the gate.
wildcards = "warn"
highlight  = "all"
deny       = []
skip       = []
skip-tree  = []

[sources]
# Only allow crates.io; no unknown registries or arbitrary git sources.
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = []
