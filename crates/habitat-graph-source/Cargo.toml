[package]
name = "habitat-graph-source"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Input acquisition for habitat-graph: file detection, local ingest, and the processed-input manifest."
keywords = ["walk", "ingest", "manifest", "knowledge-graph"]
categories = ["filesystem", "development-tools"]

[dependencies]
habitat-graph-core = { workspace = true }
blake3 = { workspace = true }
ignore = { workspace = true }
# PE: PDF text ingestion, feature-gated + off by default (local-first; no network).
pdf-extract = { version = "0.12", optional = true }

[features]
default = []
pdf = ["dep:pdf-extract"]

[dev-dependencies]
tempfile = "3"
