[package]
name = "habitat-graph-extract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "AST extraction for habitat-graph: tree-sitter language extractors emitting nodes/edges."
keywords = ["tree-sitter", "ast", "code-analysis", "knowledge-graph"]
categories = ["development-tools", "parsing"]

[dependencies]
habitat-graph-core = { workspace = true }
habitat-graph-source = { workspace = true }
rayon = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
# PA-1 grammars — feature-gated (R9a): compiled only when their feature is enabled.
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-scala = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
tree-sitter-kotlin-ng = { workspace = true, optional = true }

[features]
# Default build carries the full PA-1 factory-language set; each grammar is independently
# gateable (R9a: `--no-default-features --features go` compiles only the Go extractor).
# rust + python remain unconditional (the proven parity baseline).
default = ["ts", "js", "go", "text", "java", "c", "cpp", "ruby", "scala", "csharp", "kotlin", "php"]
ts = ["dep:tree-sitter-typescript"]
js = ["dep:tree-sitter-javascript"]
go = ["dep:tree-sitter-go"]
java = ["dep:tree-sitter-java"]
c = ["dep:tree-sitter-c"]
cpp = ["dep:tree-sitter-cpp"]
ruby = ["dep:tree-sitter-ruby"]
scala = ["dep:tree-sitter-scala"]
csharp = ["dep:tree-sitter-c-sharp"]
php = ["dep:tree-sitter-php"]
kotlin = ["dep:tree-sitter-kotlin-ng"]
text = [] # internal markdown/plaintext extractor — no grammar dependency (ABI matrix §3)

[dev-dependencies]
tempfile = "3"
