[package]
name = "habitat-graph-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Command-line interface for habitat-graph: extract a queryable knowledge graph from source."
keywords = ["cli", "knowledge-graph", "code-analysis"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "habitat-graph"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
habitat-graph-core = { workspace = true }
habitat-graph-source = { workspace = true }
habitat-graph-extract = { workspace = true }
habitat-graph-build = { workspace = true }
habitat-graph-analyze = { workspace = true }
habitat-graph-export = { workspace = true }
habitat-graph-serve = { workspace = true }
habitat-graph-daemon = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
tempfile = "3"
